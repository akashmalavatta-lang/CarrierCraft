version: '3.8'

services:
  careercraft:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cc_career_craft
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=super-secret-career-craft-key
      - JWT_SECRET_KEY=jwt-secret-career-craft-key
      - CORS_ORIGINS=*
      - PORT=5000
    volumes:
      - ./backend/instance:/app/backend/instance
      - ./backend/uploads:/app/backend/uploads
    restart: unless-stopped
